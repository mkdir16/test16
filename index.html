<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система Тестов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            font-size: 16px;
            cursor: pointer;
        }
        .hidden { display: none; }
        .question-card { width: 100%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

    <div id="subject-selection">
        <h1>Выберите предмет</h1>
        <button onclick="startTest('math')">Математика 🧮</button>
        <button onclick="startTest('python')">Python Разработка 🐍</button>
    </div>

    <div id="test-container" class="hidden">
        <h2 id="question-text">Вопрос</h2>
        <div id="options-container"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        const tests = {
            math: [
                { q: "2 + 2 * 2 = ?", options: ["4", "6", "8"], correct: 1 },
                { q: "Корень из 144?", options: ["12", "14", "10"], correct: 0 }
            ],
            python: [
                { q: "Тип данных для целых чисел?", options: ["float", "str", "int"], correct: 2 },
                { q: "Как вывести текст в консоль?", options: ["print()", "echo()", "console.log()"], correct: 0 }
            ]
        };

        let currentQuestions = [];
        let step = 0;
        let score = 0;

        function startTest(subject) {
            currentQuestions = tests[subject];
            document.getElementById('subject-selection').classList.add('hidden');
            document.getElementById('test-container').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = currentQuestions[step];
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(i);
                container.appendChild(btn);
            });
        }

        function handleAnswer(index) {
            if (index === currentQuestions[step].correct) score++;
            
            step++;
            if (step < currentQuestions.length) {
                showQuestion();
            } else {
                // ОТПРАВКА ДАННЫХ БОТУ
                tg.sendData(JSON.stringify({
                    score: score,
                    total: currentQuestions.length
                }));
            }
        }
    </script>
</body>
</html>
